# MarineCadastre.gov AIS, loaded into Postgres - the SQL connector.
#
# Managed by NOAA + BOEM + USCG. Data since 2015 ships as Zstd-compressed daily
# CSVs; use the AccessAIS extractor to pull a bounded area and time window
# rather than a multi-GB annual file. See data/fetch.sh.
#
# Messiness this source contributes, and why it is the best duplication
# generator of the three:
#   * MMSI-keyed with NO IMO on most rows -> forces the resolver to lean on
#     weak identifiers, which is where the interesting failure modes live
#   * its own USCG VesselType taxonomy, different from the AIS type codes
#     Digitraffic reports
#   * US port naming conventions, so "NEW YORK" here vs "New York" in WPI vs
#     "USNYC" in UN/LOCODE
#
# Lowest trust of the four: AIS broadcast fields are self-reported by the
# vessel and are frequently wrong or blank.

source:
  id: marinecadastre
  name: MarineCadastre.gov AIS (via Postgres)
  connector: postgres
  dsn: "postgresql://sextant:sextant@localhost:5433/maritime"
  query: |
    SELECT mmsi, imo, vessel_name, call_sign, vessel_type,
           length, width, draft, base_datetime, lat, lon, sog, cog
    FROM ais_broadcast
    WHERE base_datetime >= $1 AND base_datetime < $2
    ORDER BY mmsi, base_datetime
  cursor_size: 10000          # stream; never load a table into RAM
  natural_key: ["mmsi", "base_datetime"]
  trust: 0.60

mappings:
  - target_type: Vessel
    properties:
      name:      { from: "vessel_name", transform: [trim, collapse_ws, null_if_blank] }
      imo:       { from: "imo",         transform: [trim, strip_imo_prefix, validate_imo] }
      mmsi:      { from: "mmsi",        transform: [to_string] }
      call_sign: { from: "call_sign",   transform: [trim, upper, null_if_blank] }
      ship_type: { from: "vessel_type", transform: [to_int, uscg_to_ais_type] }
      flag:      { from: "mmsi",        transform: [to_string, mid_to_country] }
