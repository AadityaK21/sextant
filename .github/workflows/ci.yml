name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap and fast, so it runs first: catches the "compiles on my GCC 11, fails
  # on CI's GCC 13" class of failure without needing a compiler at all.
  # See docs/BUGS.md - this cost a full red CI run once.
  includes:
    name: Include hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_includes.py

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [RelWithDebInfo]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The skiplist's whole correctness argument is a release/acquire pairing.
      # Sanitizers are how that claim gets checked rather than asserted.
      - name: Configure with sanitizers
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSEXTANT_ASAN=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with TSan
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build --parallel

      # Note: inside a container TSan can fail at startup with
      #   "FATAL: ThreadSanitizer: unexpected memory mapping"
      # because of ASLR. If you hit that locally, run the binary under
      #   setarch $(uname -m) -R ./build/tests/test_skiplist
      # GitHub's runners do not need this.
      - name: Run concurrency tests
        working-directory: build
        run: ctest --output-on-failure -R "SkipList"
